[project]
name = "cvprofiles-demo"
version = "0.1.0"
description = "Interactive demo for cvprofiles: change the assumptions, watch the conclusion move."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.57",
    "cvprofiles==3.0.2",
    "pandas>=2.2",
    "altair>=5.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Not needed to run the app — install to run the invariant suite in tests/.
#   uv pip install -e ".[dev]"
dev = ["pytest>=8"]
